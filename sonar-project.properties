sonar.organization=ioexception-team
sonar.projectKey=SweetBlue16_TequioApp

# Source and colocated test layout (src/**/__tests__/)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/__mocks__/**,src/assets/**

# Match coverage denominator with Jest collectCoverageFrom
sonar.coverage.exclusions=src/main.tsx,src/**/index.ts,src/types/**,src/constants/**,**/*.d.ts

# LCOV coverage report (used for both JS and TS; sonar.typescript.lcov.reportPaths is deprecated)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Vite + TS uses project references in tsconfig.json; point directly to the app config
sonar.typescript.tsconfigPaths=tsconfig.app.json

sonar.sourceEncoding=UTF-8